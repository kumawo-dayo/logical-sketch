name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_aLE3M4fxeoNlhKQHT72KiFs1
      VERCEL_PROJECT_ID: prj_rEoPhQs4MDvEdfea7d1sHAlwcnVT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install -g vercel@latest

      - name: Deploy (fire-and-forget)
        run: timeout 90 vercel --prod --token=$VERCEL_TOKEN --yes || true

      - name: Wait for deployment to be ready
        run: |
          echo "Polling for deployment status..."
          for i in $(seq 1 18); do
            RESP=$(curl -sf \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&limit=1" \
              2>/dev/null || echo '{}')
            STATE=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin).get('deployments',[]); print(d[0]['readyState'] if d else 'NONE')" 2>/dev/null || echo "UNKNOWN")
            echo "Attempt $i/18: $STATE"
            if [ "$STATE" = "READY" ]; then
              echo "Deployment is READY"
              exit 0
            fi
            if [ "$STATE" = "ERROR" ]; then
              echo "Deployment failed"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for deployment"
          exit 1
