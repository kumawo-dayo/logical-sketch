name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_aLE3M4fxeoNlhKQHT72KiFs1
          vercel-project-id: prj_rEoPhQs4MDvEdfea7d1sHAlwcnVT
          vercel-args: --prod
          working-directory: ./
